<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Waveshare RP2040 Zero mini-board to KY-040 wiring</title>
  <desc id="desc">Front view with USB-C connector at top. KY-040 CLK to GP2, DT to GP3, SW to GP4, VCC to 3V3, GND to GND. GP2, GP3 and GP4 are on the right edge; 3V3 and GND are on the left edge.</desc>
  <rect width="1180" height="650" fill="#f8fafc"/>
  <text x="590" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">RP2040 Zero mini board ↔ KY-040</text>
  <text x="590" y="72" text-anchor="middle" font-size="16" fill="#475569">FRONT / COMPONENT SIDE · USB-C CONNECTOR AT TOP · NOT TO SCALE</text>

  <rect x="440" y="135" width="300" height="405" rx="26" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
  <rect x="520" y="105" width="140" height="54" rx="10" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
  <rect x="548" y="117" width="84" height="29" rx="7" fill="#0f172a"/>
  <text x="590" y="190" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Waveshare</text>
  <text x="590" y="215" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">RP2040 Zero</text>
  <text x="590" y="242" text-anchor="middle" font-size="14" fill="#475569">front/component side</text>
  <circle cx="590" cy="492" r="27" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="590" y="497" text-anchor="middle" font-size="12" fill="#334155">RP2040</text>

  <!-- Pin rows reflect the official Waveshare front-view pinout. -->
  <g font-size="15" font-weight="bold" text-anchor="end" fill="#0f172a">
    <text x="427" y="280">5V</text><text x="427" y="320">GND</text><text x="427" y="360">3V3</text>
  </g>
  <g fill="#f8fafc" stroke="#334155" stroke-width="2">
    <circle cx="440" cy="274" r="7"/><circle cx="440" cy="314" r="7"/><circle cx="440" cy="354" r="7"/>
  </g>
  <text x="535" y="292" text-anchor="middle" font-size="13" fill="#64748b">LEFT EDGE</text>

  <g font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">
    <text x="753" y="280">GP2</text><text x="753" y="320">GP3</text><text x="753" y="360">GP4</text>
  </g>
  <g fill="#f8fafc" stroke="#334155" stroke-width="2">
    <circle cx="740" cy="274" r="7"/><circle cx="740" cy="314" r="7"/><circle cx="740" cy="354" r="7"/>
  </g>
  <text x="650" y="292" text-anchor="middle" font-size="13" fill="#64748b">RIGHT EDGE</text>

  <rect x="875" y="190" width="245" height="285" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="997" y="228" text-anchor="middle" font-size="21" font-weight="bold" fill="#92400e">KY-040</text>
  <text x="997" y="253" text-anchor="middle" font-size="14" fill="#78350f">module header labels</text>
  <g font-size="17" font-weight="bold" text-anchor="end" fill="#111827">
    <text x="930" y="294">CLK</text><text x="930" y="334">DT</text><text x="930" y="374">SW</text><text x="930" y="414">+ / VCC</text><text x="930" y="454">GND</text>
  </g>
  <g fill="#f8fafc" stroke="#92400e" stroke-width="2">
    <circle cx="947" cy="288" r="7"/><circle cx="947" cy="328" r="7"/><circle cx="947" cy="368" r="7"/><circle cx="947" cy="408" r="7"/><circle cx="947" cy="448" r="7"/>
  </g>

  <path d="M947 288 H810 V274 H747" fill="none" stroke="#ca8a04" stroke-width="4"/>
  <path d="M947 328 H830 V314 H747" fill="none" stroke="#16a34a" stroke-width="4"/>
  <path d="M947 368 H850 V354 H747" fill="none" stroke="#9333ea" stroke-width="4"/>
  <path d="M947 408 H790 V354 H447" fill="none" stroke="#dc2626" stroke-width="4"/>
  <path d="M947 448 H770 V314 H447" fill="none" stroke="#334155" stroke-width="4"/>

  <rect x="65" y="190" width="290" height="285" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">Connection index</text>
  <g font-size="17" fill="#0f172a">
    <text x="95" y="280">KY-040 CLK</text><text x="315" y="280" text-anchor="end" font-weight="bold">GP2</text>
    <text x="95" y="320">KY-040 DT</text><text x="315" y="320" text-anchor="end" font-weight="bold">GP3</text>
    <text x="95" y="360">KY-040 SW</text><text x="315" y="360" text-anchor="end" font-weight="bold">GP4</text>
    <text x="95" y="400">KY-040 + / VCC</text><text x="315" y="400" text-anchor="end" font-weight="bold">3V3</text>
    <text x="95" y="440">KY-040 GND</text><text x="315" y="440" text-anchor="end" font-weight="bold">GND</text>
  </g>

  <rect x="65" y="555" width="1050" height="65" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="581" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">KY-040 VCC / + → 3V3 ONLY — NEVER 5V</text>
  <text x="590" y="605" text-anchor="middle" font-size="14" fill="#7f1d1d">RP2040 GPIO is not 5 V tolerant. This drawing shows the front side; pin sides mirror when viewed from the back.</text>
</svg>
