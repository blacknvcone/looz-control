<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 890" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrT" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#0d9488"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#b91c1c"/></marker>
  </defs>

  <rect width="1280" height="890" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">looz-control — Wiring Detail: NodeMCU + KY-040 → SWC KEY1/KEY2 (Head Unit Android)</text>
  <text x="640" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Output: PWM 20 kHz + RC inline (4.7 kΩ / 100 nF) · Idle = Hi-Z (pin INPUT) · Tanpa modul output</text>

  <!-- ================= KY-040 ================= -->
  <rect x="60" y="90" width="230" height="210" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="175" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">KY-040 (encoder + push)</text>

  <rect x="286" y="135" width="10" height="10" fill="#ca8a04"/>
  <text x="278" y="144" text-anchor="end" font-size="12" fill="#111827">CLK (A)</text>
  <rect x="286" y="170" width="10" height="10" fill="#16a34a"/>
  <text x="278" y="179" text-anchor="end" font-size="12" fill="#111827">DT (B)</text>
  <rect x="286" y="205" width="10" height="10" fill="#9333ea"/>
  <text x="278" y="214" text-anchor="end" font-size="12" fill="#111827">SW (push)</text>
  <rect x="286" y="240" width="10" height="10" fill="#111827"/>
  <text x="278" y="249" text-anchor="end" font-size="12" fill="#111827">GND</text>
  <rect x="286" y="270" width="10" height="10" fill="#9ca3af"/>
  <text x="278" y="279" text-anchor="end" font-size="12" fill="#9ca3af">VCC</text>

  <!-- KY wires -->
  <path d="M296 140 H350 V150 H424" stroke="#ca8a04" stroke-width="2.5" fill="none"/>
  <path d="M296 175 H368 V195 H424" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <path d="M296 210 H386 V240 H424" stroke="#9333ea" stroke-width="2.5" fill="none"/>
  <path d="M296 245 H410 V770" stroke="#111827" stroke-width="2.5" fill="none"/>
  <path d="M296 275 H312" stroke="#9ca3af" stroke-width="2.5" fill="none"/>
  <line x1="312" y1="269" x2="324" y2="281" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="312" y1="281" x2="324" y2="269" stroke="#dc2626" stroke-width="2.5"/>
  <text x="330" y="279" font-size="11" fill="#6b7280">tidak dipakai</text>

  <!-- ================= NodeMCU ================= -->
  <rect x="430" y="90" width="340" height="615" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="600" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">NodeMCU v3 (ESP8266)</text>

  <!-- left pins -->
  <rect x="424" y="145" width="10" height="10" fill="#ca8a04"/>
  <text x="442" y="154" font-size="12" fill="#111827">D5 (GPIO14) — encoder CLK</text>
  <rect x="424" y="190" width="10" height="10" fill="#16a34a"/>
  <text x="442" y="199" font-size="12" fill="#111827">D6 (GPIO12) — encoder DT</text>
  <rect x="424" y="235" width="10" height="10" fill="#9333ea"/>
  <text x="442" y="244" font-size="12" fill="#111827">D7 (GPIO13) — push switch</text>
  <rect x="424" y="560" width="10" height="10" fill="#b91c1c"/>
  <text x="442" y="569" font-size="12" fill="#111827">A0 — loopback ADC (bench)</text>

  <!-- right pins -->
  <rect x="766" y="145" width="10" height="10" fill="#2563eb"/>
  <text x="760" y="154" text-anchor="end" font-size="12" fill="#111827">D1 (GPIO5) — output KEY1</text>
  <rect x="766" y="285" width="10" height="10" fill="#0d9488"/>
  <text x="760" y="294" text-anchor="end" font-size="12" fill="#111827">D2 (GPIO4) — output KEY2</text>
  <rect x="766" y="615" width="10" height="10" fill="#111827"/>
  <text x="760" y="624" text-anchor="end" font-size="12" fill="#111827">GND</text>

  <text x="600" y="678" text-anchor="middle" font-size="11" fill="#6b7280">Power: USB (PC / port USB head unit / buck 12V→5V)</text>
  <text x="600" y="694" text-anchor="middle" font-size="11" fill="#6b7280">pin 5V &amp; 3V3 tidak dipakai untuk keluaran</text>

  <!-- ================= Output stage KEY1 ================= -->
  <path d="M776 150 H820" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <path d="M820 150 l8,-11 l16,22 l16,-22 l16,22 l16,-22 l8,11" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <path d="M900 150 H1080" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <text x="860" y="132" text-anchor="middle" font-size="11" fill="#1e40af">4.7 kΩ</text>
  <circle cx="940" cy="150" r="4.5" fill="#2563eb"/>
  <path d="M940 150 V198" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <line x1="926" y1="198" x2="954" y2="198" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="926" y1="206" x2="954" y2="206" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M940 206 V238" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <line x1="926" y1="238" x2="954" y2="238" stroke="#111827" stroke-width="2.5"/>
  <line x1="930" y1="246" x2="950" y2="246" stroke="#111827" stroke-width="2.5"/>
  <line x1="936" y1="254" x2="944" y2="254" stroke="#111827" stroke-width="2.5"/>
  <text x="960" y="228" font-size="11" fill="#1e40af">100 nF</text>

  <!-- ================= Output stage KEY2 ================= -->
  <path d="M776 290 H820" stroke="#0d9488" stroke-width="2.5" fill="none"/>
  <path d="M820 290 l8,-11 l16,22 l16,-22 l16,22 l16,-22 l8,11" stroke="#0d9488" stroke-width="2.5" fill="none"/>
  <path d="M900 290 H1080" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#arrT)"/>
  <text x="860" y="272" text-anchor="middle" font-size="11" fill="#0f766e">4.7 kΩ</text>
  <circle cx="940" cy="290" r="4.5" fill="#0d9488"/>
  <path d="M940 290 V338" stroke="#0d9488" stroke-width="2.5" fill="none"/>
  <line x1="926" y1="338" x2="954" y2="338" stroke="#0d9488" stroke-width="2.5"/>
  <line x1="926" y1="346" x2="954" y2="346" stroke="#0d9488" stroke-width="2.5"/>
  <path d="M940 346 V378" stroke="#0d9488" stroke-width="2.5" fill="none"/>
  <line x1="926" y1="378" x2="954" y2="378" stroke="#111827" stroke-width="2.5"/>
  <line x1="930" y1="386" x2="950" y2="386" stroke="#111827" stroke-width="2.5"/>
  <line x1="936" y1="394" x2="944" y2="394" stroke="#111827" stroke-width="2.5"/>
  <text x="960" y="368" font-size="11" fill="#0f766e">100 nF</text>

  <!-- wire labels before head unit -->
  <text x="1074" y="142" text-anchor="end" font-size="11" font-weight="bold" fill="#2563eb">KEY1 / SWC1</text>
  <text x="1074" y="282" text-anchor="end" font-size="11" font-weight="bold" fill="#0d9488">KEY2 / SWC2</text>

  <!-- ================= Head unit ================= -->
  <rect x="1080" y="90" width="190" height="590" rx="10" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="1175" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b21a8">Head unit Android</text>
  <path d="M1120 138 H1245" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <text x="1182" y="132" text-anchor="middle" font-size="10" fill="#7e22ce">Vrail (3.3 / 5V)</text>

  <path d="M1080 150 H1140" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <circle cx="1140" cy="150" r="4" fill="#2563eb"/>
  <path d="M1140 150 V138" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <path d="M1080 290 H1180" stroke="#0d9488" stroke-width="2.5" fill="none"/>
  <circle cx="1180" cy="290" r="4" fill="#0d9488"/>
  <path d="M1180 290 V138" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <text x="1186" y="222" font-size="10" fill="#7e22ce">pull-up</text>
  <text x="1186" y="235" font-size="10" fill="#7e22ce">≈10k</text>

  <path d="M1080 620 H1060 V770" stroke="#111827" stroke-width="2.5" fill="none"/>
  <circle cx="1080" cy="620" r="4" fill="#111827"/>
  <text x="1092" y="624" font-size="11" fill="#111827">GND</text>

  <!-- ================= GND bus ================= -->
  <path d="M410 770 H1060" stroke="#111827" stroke-width="3" fill="none"/>
  <path d="M776 620 H800 V770" stroke="#111827" stroke-width="2.5" fill="none"/>
  <circle cx="410" cy="770" r="4.5" fill="#111827"/>
  <circle cx="800" cy="770" r="4.5" fill="#111827"/>
  <circle cx="1060" cy="770" r="4.5" fill="#111827"/>
  <text x="640" y="792" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">GND BERSAMA (common): NodeMCU ↔ KY-040 ↔ harness head unit</text>

  <!-- ================= A0 loopback (bench, dashed) ================= -->
  <circle cx="1000" cy="150" r="4.5" fill="#2563eb"/>
  <path d="M1000 150 V748" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  <circle cx="1040" cy="290" r="4.5" fill="#0d9488"/>
  <path d="M1040 290 V748" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  <rect x="991" y="630" width="18" height="26" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="985" y="648" text-anchor="end" font-size="11" font-weight="bold" fill="#b91c1c">J1</text>
  <rect x="1031" y="600" width="18" height="26" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="1025" y="618" text-anchor="end" font-size="11" font-weight="bold" fill="#b91c1c">J2</text>
  <path d="M350 748 H1040" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  <circle cx="1000" cy="748" r="4" fill="#b91c1c"/>
  <circle cx="1040" cy="748" r="4" fill="#b91c1c"/>
  <path d="M350 748 V565 H424" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrR)"/>
  <text x="695" y="736" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">J1/J2 (bench): PASANG SATU SAJA — lepas saat node ke harness</text>
  <text x="336" y="656" text-anchor="middle" font-size="11" fill="#b91c1c" transform="rotate(-90 336 656)">loopback A0 — BENCH SAJA</text>

  <!-- ================= Notes ================= -->
  <text x="60" y="814" font-size="12" fill="#374151">• Output inline: 4.7 kΩ + 100 nF disolder di tengah kabel dupont (solder ujung komponen ke kabel + shrink tubing) — tanpa PCB.</text>
  <text x="60" y="832" font-size="12" fill="#374151">• Idle = D1/D2 mode INPUT (Hi-Z): node tegang penuh di rail pull-up = "tanpa tombol" — berlaku untuk rail 3.3V maupun 5V.</text>
  <text x="60" y="850" font-size="12" fill="#374151">• Bench: node KEY1/KEY2 di-jumper (satuan) ke A0 untuk ukur tegangan via serial "adc". Saat terpasang di head unit, J1/J2 DILEPAS.</text>
  <text x="60" y="868" font-size="12" fill="#374151">• D1/D2 Hi-Z alami saat boot (sebelum firmware jalan). Jangan pernah hubungkan GPIO langsung ke pin KEY tanpa resistor 4.7 kΩ.</text>
</svg>
